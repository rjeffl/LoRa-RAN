; Standalone test project for /lib/vedirect/.
;
; Firmware projects consume the library through `lib_extra_dirs`; this file exists so
; the Unity suite can be run on its own:
;
;   pio test -d lib/vedirect -e native
;
; Arduino-free, as lran-protocol is (root rule 7): the simnode's simulated MPPT and the
; bridge's register readback both run this code in their own host suites.

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -I include
