; Standalone test project for /lib/lran-protocol/.
;
; The library is consumed by the firmware projects through `lib_extra_dirs`; this
; file exists only so the Unity suite can be run on its own:
;
;   pio test -d lib/lran-protocol -e native
;
; The library must keep building here. If the native environment stops building that
; is a defect to fix now, not a nuisance to route around - the tests live here, and a
; library that only compiles for the ESP32-S3 has quietly acquired a platform
; dependency.

[env:native]
platform = native
test_framework = unity
; The library source is linked into every test binary; without this PlatformIO
; builds the tests against nothing.
test_build_src = yes
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -I include
    -I platform/native
build_src_filter = +<*> +<../platform/native/>

; ---------------------------------------------------------------------------
; P7 - target build. Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262).
;
; A TEST environment, not firmware: `pio test -e esp32s3` uploads the Unity
; suites and reports over serial. That keeps P7.2/P7.3 free of WiFi, MQTT and
; secrets.h - the vectors use the committed TEST-ONLY key and nothing else.
;
; The point of this environment is that the target uses mbedTLS where the host
; uses the portable reference implementation (platform/native/refimpl_mac.cpp,
; which is portable rather than native-only despite the directory name). Both
; are built here and P7.2 compares them against the same KATs. Agreement is the
; thing being tested; a divergence means something is reading struct layout.
; ---------------------------------------------------------------------------
[env:esp32s3]
; The version every firmware target pins. Unpinned, this resolved to whichever
; espressif32 happened to be installed, so the mbedTLS it compared against was not
; necessarily the one the firmware links.
platform = espressif32@6.13.0
board = heltec_wifi_lora_32_V3
framework = arduino
test_framework = unity
test_build_src = yes
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I include
    -I platform/native
    -I platform/esp32
build_unflags = -std=gnu++11
build_src_filter = +<*> +<../platform/native/> +<../platform/esp32/>
