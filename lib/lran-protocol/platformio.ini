; Standalone test project for /lib/lran-protocol/.
;
; The library is consumed by the firmware projects through `lib_extra_dirs`; this
; file exists only so the Unity suite can be run on its own:
;
;   pio test -d lib/lran-protocol -e native
;
; The library must keep building here. If the native environment stops building that
; is a defect to fix now, not a nuisance to route around - the tests live here, and a
; library that only compiles for the ESP32-S3 has quietly acquired a platform
; dependency.

[env:native]
platform = native
test_framework = unity
; The library source is linked into every test binary; without this PlatformIO
; builds the tests against nothing.
test_build_src = yes
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -I include
    -I platform/native
build_src_filter = +<*> +<../platform/native/>
