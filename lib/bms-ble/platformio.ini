;
; Standalone test project for /lib/bms-ble/.
;
; Firmware projects consume the library through `lib_extra_dirs`; this file exists so
; the Unity suite can be run on its own:
;
;   pio test -d lib/bms-ble -e native
;
; The protocol layer is Arduino-free, so the 21 tests run against the captured frames in
; docs/gatelink/bms-protocol.md §9 with no board attached. nimble_transport.cpp compiles to
; nothing here, because ARDUINO is undefined.

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -I include
