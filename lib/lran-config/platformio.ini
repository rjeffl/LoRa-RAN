; Standalone test project for /lib/lran-config/.
;
; Firmware projects consume the library through `lib_extra_dirs`; this file exists so
; the Unity suite can be run on its own:
;
;   pio test -d lib/lran-config -e native
;
; Root rule 7 applies here as it does to lran-protocol and lran-link: no Arduino, no
; ESP-IDF, no NVS. A node's nonvolatile store is injected, so the policy that decides
; what a SET does is tested on the host without one.

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -I include

; A symlink dependency, not `lib_extra_dirs = ..` - see lib/lran-link/platformio.ini for
; what the latter does to Unity's include path.
lib_deps = symlink://../lran-protocol
