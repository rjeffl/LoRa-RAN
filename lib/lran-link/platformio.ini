; Standalone test project for /lib/lran-link/.
;
; Firmware projects consume the library through `lib_extra_dirs`; this file exists so
; the Unity suite can be run on its own:
;
;   pio test -d lib/lran-link -e native
;
; Root rule 7 applies here as it does to lran-protocol: this environment has no
; Arduino and no FreeRTOS, so a blocking call or a millis() cannot creep into the
; policy both radio tasks run.

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -I include

; A symlink dependency, not `lib_extra_dirs = ..`. The latter makes this directory's own
; parent a library folder, the Library Dependency Finder picks this project up as a
; library of itself, and the test build loses Unity's include path - `unity.h` not found,
; with nothing pointing at the cause.
lib_deps = symlink://../lran-protocol
