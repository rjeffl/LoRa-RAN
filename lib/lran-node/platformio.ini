; Standalone test project for /lib/lran-node/.
;
; Firmware projects consume the library through `lib_extra_dirs`; this file exists so
; the Unity suite can be run on its own:
;
;   pio test -d lib/lran-node -e native
;
; Root rule 7 applies here as it does to the other libraries: no Arduino and no FreeRTOS.
; GateLink runs this engine across tasks (Impl Plan 5.2), and the simnode on one loop; the
; tests here are what both rely on.

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -I include
    -I ../lran-protocol/platform/native
    -I ../lran-protocol/test/test_vectors
build_src_filter = +<*> +<../../lran-protocol/platform/native/>

; Symlink dependencies, not `lib_extra_dirs = ..` - see lib/lran-link/platformio.ini for
; what the latter does to Unity's include path.
lib_deps =
    symlink://../lran-protocol
    symlink://../lran-link
    symlink://../lran-config
