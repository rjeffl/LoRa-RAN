; Standalone test project for /lib/lran-sim/.
;
; The simnode consumes the library through `lib_extra_dirs`; this file exists so the
; Unity suite can be run on its own:
;
;   pio test -d lib/lran-sim -e native
;
; Root rule 7 applies: no Arduino here. The suite checks FramePatch against the W4
; negative vectors, which the Python generator built by patching frames the same way,
; so it needs the vectors, the committed test key and the reference HMAC.

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -I include
    -I ../lran-protocol/platform/native
    -I ../lran-protocol/test/test_vectors
build_src_filter = +<*> +<../../lran-protocol/platform/native/>

; A symlink dependency, not `lib_extra_dirs = ..`, for the reason lib/lran-link's
; platformio.ini gives: the latter loses Unity's include path.
lib_deps = symlink://../lran-protocol
