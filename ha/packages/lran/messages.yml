#
# The text of every LRAN push, email and logbook entry, in one place (HA Integration
# Implementation Plan 7.5). Edit the wording here. Do not edit it in alerts.yaml.
#
# To apply an edit, copy this file to /config/packages/lran/ and reload scripts. No restart
# is needed. script.lran_notify reads the file when the scripts load.
#
# WHY .yml AND NOT .yaml. HA loads every *.yaml under packages/lran/ as a package, and this
# file is not a package. core.yaml reads it with !include, which ignores the extension.
#
# AN ENTRY is the name an automation passes as `alert` or `msg`, holding:
#   title     the push title and email subject
#   message   the body
#   level     the alert's default delivery: "Off", Low, Normal, High or Critical, with Off in
#             quotes, because YAML reads a bare Off as false. Only an entry
#             with a level has a selector on the Maintenance dashboard. The selector, not
#             this value, decides delivery. This value is what "Restore default levels"
#             sets it back to
#   <field>   a map translating one placeholder's raw value into words. `missing` is the
#             text for an empty value; `other` is the text for a value the map does not
#             list. Without `other`, an unlisted value appears as it arrived
#
# {name} in a title or message is replaced with the field of that name the automation
# passes. An empty field becomes the field map's `missing` text, or else _missing below.
# A placeholder no automation passes appears as written, so a typo shows in the push.
# Do not write {{ }} or {% %} here: HA would render them as a template.

# Shared text.
_missing: not reported
# Appended to the title of a logbook entry for an alert whose level is Off.
_off_note: (alert off, not pushed)
# Appended to the title of a logbook entry for an alert held back by lran_alerts_muted.
_muted_note: (alerts muted, not pushed)

# --- Tier 1 (plan 9.1) ---

# R-3.2.4. The follow-up with the traversal direction (R-3.2.4b) replaces this push. A
# direction of none or undetermined says nothing a person can use, so it reads as `other`.
vehicle_while_held:
  level: High
  title: Vehicle at the gate while held open
  message: "{direction} while the gate was held open (hold source: {hold_source})."
  direction:
    entry: A vehicle came in
    exit: A vehicle went out
    other: A vehicle passed
    missing: A vehicle passed

# Spec 8.9, R-3.2.5a. The one LRAN signal allowed to wake someone, so Critical by default.
fire:
  level: Critical
  title: FIRE at the gate
  message: "GateLink reports FIRE asserted (hold source: {hold_source}, gate {gate_state})."
  gate_state:
    missing: state not reported

hard_shutdown:
  level: High
  title: GateLink hard shutdown
  message: "GateLink reports a hard shutdown (gate {gate_state}, detail {detail})."
  gate_state:
    missing: state not reported

# {detail} arrives in hex: spec 8.9 gives BMS_ALARM's detail no meaning yet.
bms_alarm:
  level: High
  title: GateLink BMS alarm
  message: "The GateLink battery's BMS raised an alarm (detail {detail})."

gatelink_offline:
  level: High
  title: GateLink offline
  message: >-
    The bridge has not heard GateLink for {warn_min} minutes. HA cannot see or command the
    gate until it returns.

# Sent at gatelink_offline's level, as a follow-up that replaces its push. {gone} arrives
# formatted, as "12 minutes" or "1 h 05 min".
gatelink_online:
  title: GateLink back online
  message: "GateLink is back after {gone} offline."

# Push only, whatever the level: the HA host that would send the email may be what failed.
bridge_offline:
  level: High
  title: LRAN bridge offline
  message: >-
    The LRAN bridge has been off the MQTT broker for 5 minutes. HA cannot see or command
    any LRAN node until it returns.

# --- Tier 2, health (plan 9.2) ---

# The alarm's push replaces the warning's. {soc} is a percentage, {limit} the threshold
# crossed, from lran_soc_warn_pct or lran_soc_alarm_pct.
soc_low:
  level: Normal
  title: GateLink battery low
  message: "The GateLink battery is at {soc} %, below the {limit} % warning."

soc_alarm:
  level: High
  title: GateLink battery very low
  message: >-
    The GateLink battery is at {soc} %, below the {limit} % alarm. The gate may lose power
    if it keeps falling.

# Spec 8.9, D81: the path that decided the inhibition.
charge_inhibited:
  level: Normal
  title: GateLink charging inhibited
  message: "Charging of the GateLink battery is inhibited, decided by {inhibit_path}."
  inhibit_path:
    bms: the BMS
    vedirect: the MPPT (VE.Direct)
    not_stated: a path GateLink did not state

# {error} is VE.Direct's error name as the bridge gives it, underscores as spaces.
mppt_error:
  level: Normal
  title: GateLink MPPT error
  message: "The GateLink solar charger reports an error: {error}."
  error:
    missing: no error name reported

# S-14: every excursion is also a logbook entry, which lran_notify writes at any level.
# {temp} arrives with its unit; {limit} is lran_enclosure_temp_warn_c, in °C.
enclosure_hot:
  level: Normal
  title: GateLink enclosure hot
  message: >-
    The GateLink enclosure has been at {temp} for 15 minutes, above the {limit} °C
    warning.

cell_spread:
  level: Normal
  title: GateLink cell imbalance
  message: >-
    The GateLink battery's cells have differed by {spread} mV for 30 minutes, above the
    {limit} mV warning.

# Spec 8.14's reset causes, as the bridge names them.
node_boot:
  level: Low
  title: GateLink restarted
  message: "Reset cause: {reset_cause}."
  reset_cause:
    power_on: power applied
    reboot_command: a reboot command
    software: a restart the firmware chose
    watchdog: a watchdog expired
    panic: a firmware panic
    brownout: a brownout
    external: the reset pin or USB
    unknown: cause unknown
    other: cause unknown

# Three boots within an hour (plan 9.2). It replaces itself on each further boot.
node_boot_loop:
  level: High
  title: GateLink boot loop
  message: "GateLink has restarted {count} times in the last hour. The last: {reset_cause}."
  reset_cause:
    power_on: power applied
    reboot_command: a reboot command
    software: a restart the firmware chose
    watchdog: a watchdog expired
    panic: a firmware panic
    brownout: a brownout
    external: the reset pin or USB
    unknown: cause unknown
    other: cause unknown

# Spec 12.4.2, 16.7.5. The bridge's report carries a reason and the node that caused it;
# a node's own revert carries neither.
phy_reverted:
  level: High
  title: PHY change reverted
  message: "A PHY change did not commit, reported by {source}: {reason}. Node named: {culprit}."
  source:
    bridge: the bridge
    gatelink: GateLink
  reason:
    not_accepted: a node did not accept every value
    not_heard: a node was not heard on the new settings
    restart: the bridge restarted during the trial
    commit_failed: the bridge could not store the new settings
    missing: the node went back to its last known-good settings
  culprit:
    gatelink: GateLink
    missing: none
