#
# Sensors derived from GateLink's (HA Integration Implementation Plan 7.4). Each reads
# unavailable while an input does, never a cached value (System PRD 6.2). The bridge
# publishes mV and mA (plan 2), so the arithmetic here is in those units.

template:
  - sensor:
      - name: LRAN GateLink cell spread
        unique_id: lran_gatelink_cell_spread
        unit_of_measurement: mV
        device_class: voltage
        state_class: measurement
        icon: mdi:battery-sync-outline
        availability: >-
          {{ ['sensor.gatelink_cell_1_voltage', 'sensor.gatelink_cell_2_voltage',
              'sensor.gatelink_cell_3_voltage', 'sensor.gatelink_cell_4_voltage']
             | map('states') | select('is_number') | list | count == 4 }}
        state: >-
          {% set c = ['sensor.gatelink_cell_1_voltage', 'sensor.gatelink_cell_2_voltage',
                      'sensor.gatelink_cell_3_voltage', 'sensor.gatelink_cell_4_voltage']
                     | map('states') | map('float') | list %}
          {{ (c | max - c | min) | round(0) }}

      # Power into the pack: positive while charging, negative while the loads draw it down.
      # The pack rather than the MPPT's load output, because the gate controller and
      # GateLink hang on the battery bus and the load output reads 0 (plan 7.4).
      - name: LRAN GateLink net power
        unique_id: lran_gatelink_net_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >-
          {{ has_value('sensor.gatelink_pack_voltage')
             and has_value('sensor.gatelink_pack_current') }}
        state: >-
          {{ (states('sensor.gatelink_pack_voltage') | float
              * states('sensor.gatelink_pack_current') | float / 1000000) | round(1) }}

      # What everything on the battery bus draws: the MPPT's charge current less what
      # reaches the pack. Both are positive into the battery (spec 7.2.2, 7.2.3). Their
      # readings are not simultaneous, so a sample can dip below zero, and it is clamped.
      - name: LRAN GateLink draw current
        unique_id: lran_gatelink_draw_current
        unit_of_measurement: mA
        device_class: current
        state_class: measurement
        availability: >-
          {{ has_value('sensor.gatelink_battery_current_mppt')
             and has_value('sensor.gatelink_pack_current') }}
        state: >-
          {{ [states('sensor.gatelink_battery_current_mppt') | float
              - states('sensor.gatelink_pack_current') | float, 0] | max | round(0) }}

      # AN ESTIMATE, and the card says so. Remaining charge from SOC and the pack's
      # capacity, over the mean daily draw across the window the 7-day statistic covers.
      # Unavailable until that window spans a whole day.
      - name: LRAN GateLink autonomy days
        unique_id: lran_gatelink_autonomy_days
        unit_of_measurement: d
        device_class: duration
        state_class: measurement
        icon: mdi:battery-clock-outline
        availability: >-
          {% set days = state_attr('sensor.lran_gatelink_draw_7d', 'age_coverage_ratio')
                        | float(0) * 7 %}
          {{ has_value('sensor.gatelink_battery')
             and is_number(states('sensor.lran_gatelink_draw_7d'))
             and states('sensor.lran_gatelink_draw_7d') | float > 0
             and days >= 1 }}
        state: >-
          {% set days = state_attr('sensor.lran_gatelink_draw_7d', 'age_coverage_ratio')
                        | float * 7 %}
          {% set per_day_mah = states('sensor.lran_gatelink_draw_7d') | float / days %}
          {% set left_mah = states('sensor.gatelink_battery') | float / 100
                            * states('input_number.lran_pack_capacity_ah') | float * 1000 %}
          {{ (left_mah / per_day_mah) | round(1) }}

      # Starting thresholds, not measured ones. SF9's demodulation floor is -12.5 dB SNR,
      # so -5 dB leaves 7.5 dB of margin and -10 dB leaves 2.5. Revisit them against
      # production history, as plan 7.1 says of every threshold.
      - name: LRAN GateLink link quality
        unique_id: lran_gatelink_link_quality
        icon: mdi:signal-variant
        availability: >-
          {{ is_number(states('sensor.gatelink_snr'))
             and is_number(states('sensor.gatelink_missed_polls')) }}
        state: >-
          {% set snr = states('sensor.gatelink_snr') | float %}
          {% set missed = states('sensor.gatelink_missed_polls') | int %}
          {% if missed >= 3 or snr < -10 %}poor
          {% elif missed >= 1 or snr < -5 %}marginal
          {% else %}good{% endif %}

      # The Gate dashboard's status line (plan 8.1). The cover carries the direction the
      # bridge infers (spec 8.3), and the raw gate state tells the two open states apart.
      - name: LRAN GateLink gate status
        unique_id: lran_gatelink_gate_status
        icon: mdi:gate
        state: >-
          {% set gate = states('sensor.gatelink_gate') %}
          {% set cover = states('cover.gatelink_gate') %}
          {% if gate == 'fault' %}Fault
          {% elif cover == 'closed' %}Closed
          {% elif cover == 'opening' %}Opening
          {% elif cover == 'closing' %}Closing
          {% elif gate == 'open_held' %}Open and holding
          {% elif gate == 'open_countdown' %}Open and auto close pending
          {% else %}Status unknown{% endif %}

      # For display only (plan 7.4). The recorder excludes them (site.yaml), and
      # graphs read the raw mV sensors. No device class: with one, HA suggests a display
      # precision of 0 and shows 13.31 V as 13 V, and the template schema rejects
      # suggested_display_precision (engineering log, 2026-10-25).
      - name: LRAN GateLink pack voltage V
        unique_id: lran_gatelink_pack_voltage_v
        unit_of_measurement: V
        icon: mdi:flash
        availability: "{{ has_value('sensor.gatelink_pack_voltage') }}"
        state: "{{ (states('sensor.gatelink_pack_voltage') | float / 1000) | round(2) }}"
      - name: LRAN GateLink PV voltage V
        unique_id: lran_gatelink_pv_voltage_v
        unit_of_measurement: V
        icon: mdi:flash
        availability: "{{ has_value('sensor.gatelink_pv_voltage') }}"
        state: "{{ (states('sensor.gatelink_pv_voltage') | float / 1000) | round(2) }}"

      # The traversal counter as a sensor with a state class, so HA keeps long-term
      # statistics for it and the Events view can chart traversals per day for 30 d
      # (plan 8.2). A counter has no state class, and the recorder's own history ends at
      # purge_keep_days. total_increasing reads the midnight reset as a new cycle, so a
      # day's "change" is that day's count.
      - name: LRAN GateLink traversals
        unique_id: lran_gatelink_traversals
        state_class: total_increasing
        icon: mdi:car-arrow-right
        availability: "{{ has_value('counter.lran_gatelink_traversals_today') }}"
        state: "{{ states('counter.lran_gatelink_traversals_today') | int }}"

  # The Vehicles dashboard's log (plan 7.4): today's gate crossings, newest first. A
  # trigger-based sensor keeps them across a restart, and the recorder excludes it
  # (site.yaml), because every crossing rewrites the whole list.
  #
  # The first event names no direction (spec 7.3), so the sensor that fired, in input_bits,
  # names it: SAFETY first is entering and EXIT first is leaving (spec 8.6). The follow-up
  # confirms the crossing or, with no direction and one sensor at most, says it did not
  # finish. A second event inside one detection is a held-open alert raised by a later edge
  # (detect.cpp), so it marks the same entry held and adds none. Repeats change nothing, so
  # this needs no event filter.
  - triggers:
      - trigger: mqtt
        topic: lran/gatelink/event/vehicle_detected
      - trigger: mqtt
        topic: lran/gatelink/event/vehicle_while_held_open
      # Clears yesterday's entries, through the day check below.
      - trigger: time
        at: "00:00:00"
    variables:
      entries: >-
        {%- set me = 'sensor.lran_gatelink_crossing_log' -%}
        {%- set today = now().date() | string -%}
        {%- set log = (state_attr(me, 'entries') or [])
              if state_attr(me, 'day') == today else [] -%}
        {%- set p = trigger.payload_json | default({}) if trigger.platform == 'mqtt' else {} -%}
        {%- set key = '%d:%d' % (p.ctx_id, p.event_id)
              if p.ctx_id is number and p.event_id is number else '' -%}
        {%- set follow = p.follow_up is sameas true -%}
        {%- set found = log | selectattr('key', 'eq', key) | list -%}
        {%- if not key or p.synthetic is sameas true or (found and not follow) -%}
          {{- log -}}
        {%- else -%}
          {%- set alert = p.event_type == 'vehicle_while_held_open' -%}
          {%- set bits = p.input_bits | int(0) -%}
          {%- set safety = bits | bitwise_and(4) != 0 -%}
          {%- set exit = bits | bitwise_and(8) != 0 -%}
          {%- set known = p.direction if p.direction in ['entry', 'exit'] else '' -%}
          {%- set sensed = 'entry' if safety and not exit
                else 'exit' if exit and not safety else '' -%}
          {%- set merge = alert and not follow and not found and log | length > 0
                and (known != '' or log[0].state == 'pending') -%}
          {%- set base = found[0] if found else log[0] if merge else none -%}
          {%- set dir = known or (base.dir if base else '') or (sensed if not follow else '') -%}
          {%- set state = base.state if merge
                else 'crossed' if known or (safety and exit)
                else 'partial' if follow else 'pending' -%}
          {%- set held = alert or p.gate_state == 'open_held' or (base.held if base else false) -%}
          {%- set time = base.time if base else now().strftime('%-I:%M %p') -%}
          {%- set words = {
                'crossed': {'entry': 'Vehicle entered', 'exit': 'Vehicle left', '': 'Vehicle crossed'},
                'pending': {'entry': 'Vehicle entering', 'exit': 'Vehicle leaving', '': 'Vehicle at the gate'},
                'partial': {'entry': 'Vehicle started entering', 'exit': 'Vehicle started leaving',
                            '': 'Vehicle tripped a sensor'}} -%}
          {%- set text = words[state][dir] ~ ' at ' ~ time
                ~ (' but did not cross' if state == 'partial' else '')
                ~ (', direction unknown' if state == 'crossed' and not dir else '')
                ~ (', gate held open' if held else '') -%}
          {%- set entry = dict(key=key, time=time, dir=dir, state=state, held=held, text=text) -%}
          {%- set ns = namespace(out=[] if base else [entry]) -%}
          {%- for e in log -%}
            {%- set ns.out = ns.out + [entry if base and e.key == base.key else e] -%}
          {%- endfor -%}
          {{- ns.out[:200] -}}
        {%- endif -%}
    sensor:
      - name: LRAN GateLink crossing log
        unique_id: lran_gatelink_crossing_log
        icon: mdi:book-clock-outline
        state: "{{ entries | length }}"
        attributes:
          day: "{{ now().date() | string }}"
          entries: "{{ entries }}"

sensor:
  # What the charge-inhibit temperature is compared with (R-6.4a): the lowest of the four
  # BMS sensors, because any of them may be the coldest cell.
  - platform: min_max
    name: LRAN GateLink lowest pack temperature
    unique_id: lran_gatelink_lowest_pack_temperature
    type: min
    entity_ids:
      - sensor.gatelink_pack_temperature_1
      - sensor.gatelink_pack_temperature_2
      - sensor.gatelink_pack_temperature_3
      - sensor.gatelink_pack_temperature_4

  # mAh drawn, cumulative. max_sub_interval advances it while the draw holds steady,
  # because the source updates only when its value changes.
  - platform: integration
    name: LRAN GateLink draw
    unique_id: lran_gatelink_draw
    source: sensor.lran_gatelink_draw_current
    method: left
    unit_time: h
    round: 0
    max_sub_interval:
      minutes: 5

  # sampling_size is set because the buffer defaults to 20 samples, far short of a week.
  # The integration updates at least every 5 minutes, so a week is about 2 000 samples,
  # and more while the draw changes.
  - platform: statistics
    name: LRAN GateLink draw 7d
    unique_id: lran_gatelink_draw_7d
    entity_id: sensor.lran_gatelink_draw
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 50000
    keep_last_sample: true

  - platform: statistics
    name: LRAN GateLink enclosure temp max 24h
    unique_id: lran_gatelink_enclosure_temp_max_24h
    entity_id: sensor.gatelink_enclosure_temperature
    state_characteristic: value_max
    max_age:
      hours: 24
    sampling_size: 20000
    keep_last_sample: true
  - platform: statistics
    name: LRAN GateLink enclosure temp min 24h
    unique_id: lran_gatelink_enclosure_temp_min_24h
    entity_id: sensor.gatelink_enclosure_temperature
    state_characteristic: value_min
    max_age:
      hours: 24
    sampling_size: 20000
    keep_last_sample: true
