#
# The Gate dashboard (HA Integration Implementation Plan 8.1): for everyone, and for
# operation only. It has the gate's three actions, its status and the link. Everything else
# is on LRAN Status, which is admin only. YAML mode, so this file is the source (plan 6);
# install it as /config/dashboards/lran/gate.yaml.
#
# Fluvy's cards throughout (plan 2, task H11), written from its documentation: its card
# editors cannot save to a YAML dashboard.

title: Gate
views:
  - title: Gate
    path: gate
    icon: mdi:gate
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          # Status, not controls: text on the page with no card around it, so it does not read
          # as a button. Centred on the action tiles below it, with the link beneath them.
          - type: markdown
            text_only: true
            content: |-
              {% set s = states('sensor.lran_gatelink_gate_status') %}
              {% set icon = {'Closed': 'mdi:gate', 'Opening': 'mdi:arrow-expand-horizontal', 'Closing': 'mdi:arrow-collapse-horizontal', 'Open and holding': 'mdi:lock', 'Open and auto close pending': 'mdi:timer-sand', 'Fault': 'mdi:alert-octagon'}.get(s, 'mdi:help-circle-outline') %}
              {% set colour = {'Closed': 'green', 'Opening': 'dodgerblue', 'Closing': 'dodgerblue', 'Open and holding': 'red', 'Open and auto close pending': 'darkorange', 'Fault': 'red'}.get(s, 'gray') %}
              <center>

              ## Gate Status:&nbsp; <font color="{{ colour }}"><ha-icon icon="{{ icon }}"></ha-icon></font> {{ s }}

              </center>
            grid_options:
              columns: 12

          # Words and icons, because Fluvy's cover card draws its buttons as bare arrows
          # (plan 8.3). A scenes card takes any entity once each tile names its own tap
          # action. All three send at once, with no confirmation (plan 2), and none greys
          # out, so Open on an open gate is still a relay pulse (S-8). Open pulses even
          # while the gate is held, which leaves it held (operator, 2026-11-01).
          - type: custom:fluvy-scenes-card
            columns: 1
            scenes:
              - entity: cover.gatelink_gate
                name: Open - AutoClose
                icon: mdi:gate-open
                subtitle: Opens, then closes on its own
                tap_action:
                  action: perform-action
                  perform_action: cover.open_cover
                  target:
                    entity_id: cover.gatelink_gate
              # GateLink PRD 7.1: on opens and locks.
              - entity: switch.gatelink_hold_gate_open
                name: Open - Hold
                icon: mdi:lock
                subtitle: Opens and stays open
                tap_action:
                  action: perform-action
                  perform_action: switch.turn_on
                  target:
                    entity_id: switch.gatelink_hold_gate_open
              # GateLink PRD 7.1: the cover releases any hold, then closes at once.
              - entity: cover.gatelink_gate
                name: Close
                icon: mdi:gate
                subtitle: Unlocks and closes
                tap_action:
                  action: perform-action
                  perform_action: cover.close_cover
                  target:
                    entity_id: cover.gatelink_gate
            grid_options:
              columns: 12

          # The link line no longer opens the Network view, which is admin only (plan 8.1).
          # Marginal shares Poor's colour and keeps its own word (operator, 2026-11-01). The
          # sensor is unavailable while GateLink is, which is No link.
          - type: markdown
            text_only: true
            content: |-
              {% set q = states('sensor.lran_gatelink_link_quality') %}
              <center>

              <font color="{{ {'good': 'green', 'marginal': 'darkorange', 'poor': 'darkorange'}.get(q, 'gray') }}"><ha-icon icon="mdi:signal-variant"></ha-icon></font> {{ {'good': 'Link good', 'marginal': 'Link marginal', 'poor': 'Link poor'}.get(q, 'No link') }}

              </center>
            grid_options:
              columns: 12
