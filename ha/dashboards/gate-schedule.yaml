#
# The Gate Schedule dashboard (HA Integration Implementation Plan 8.5): for everyone, as
# the Gate dashboard is, which links here. YAML mode, so this file is the source (plan 6);
# install it as /config/dashboards/lran/gate-schedule.yaml.
#
# The list and the add form are the Scheduler card's (nielsfaber, HACS). Its schedules are
# runtime data in HA's storage. The rules each event follows are in
# packages/lran/schedule.yaml (plan 9.6).

title: Gate Schedule
views:
  - title: Gate Schedule
    path: schedule
    icon: mdi:calendar-clock
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          # The master switch first, because off it overrides every entry in the list
          # below, and the list does not show that.
          - type: custom:fluvy-helpers-card
            title: Gate schedule
            rows:
              - entity: input_boolean.lran_gate_schedule_enabled
                name: Run scheduled events
            grid_options:
              columns: 12
          # The last event as text, not as its input_text row, which would offer it for
          # editing and cut it to the row's width.
          - type: markdown
            text_only: true
            content: >-
              {% if is_state('input_boolean.lran_gate_schedule_enabled', 'off') %}
              <font color="darkorange"><ha-icon icon="mdi:calendar-remove"></ha-icon></font>
              **Scheduling is off.** No event below will move the gate.<br>
              {% endif %}
              **Last event:** {{ states('input_text.lran_gate_schedule_last')
                 if has_value('input_text.lran_gate_schedule_last') else 'none yet' }}
            grid_options:
              columns: 12

          # Restricted to the two LRAN scripts, so the card cannot schedule anything else.
          # discover_existing is off, so a schedule another card made for another entity
          # does not appear here. Each row's toggle suspends it; tapping it edits or
          # deletes it. "Once" is set in the options panel, under behaviour after completion.
          # Sorted by the time to the next run, which makes the list the pending events in
          # order. The actions are customized so the add dialog names them; their icons
          # render as the default lightning bolt in the sandbox's screenshots (plan 8.5).
          - type: custom:scheduler-card
            title: Scheduled events
            discover_existing: false
            include:
              - script.lran_gate_schedule_open_hold
              - script.lran_gate_schedule_close
            customize:
              script.lran_gate_schedule_open_hold:
                name: Open - Hold
                icon: mdi:lock
                actions:
                  - service: turn_on
                    name: Open - Hold
                    icon: mdi:lock
              script.lran_gate_schedule_close:
                name: Close
                icon: mdi:gate
                actions:
                  - service: turn_on
                    name: Close
                    icon: mdi:gate
            time_step: 5
            sort_by: relative-time
            display_options:
              primary_info: "<b>{entity}</b>"
              secondary_info:
                - "{time} · {days}"
                - relative-time
              icon: action
            grid_options:
              columns: 12

          - type: markdown
            text_only: true
            content: >-
              An event runs only when it is needed: Open - Hold when the gate is not already
              held, and Close when it is not already closed. If GateLink is offline, the event
              keeps trying for the retry window, then sends a push saying it failed.
            grid_options:
              columns: 12

      - type: grid
        cards:
          - type: custom:fluvy-helpers-card
            title: Retry settings
            rows:
              - entity: input_number.lran_gate_schedule_window_min
                name: Keep trying for
              - entity: input_number.lran_gate_schedule_confirm_s
                name: Wait for confirmation
              - entity: input_number.lran_gate_schedule_attempts
                name: Attempts
            grid_options:
              columns: 12
