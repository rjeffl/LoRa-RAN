#
# The Vehicles dashboard (HA Integration Implementation Plan 8.4): today's gate crossings,
# for everyone. YAML mode, so this file is the source (plan 6); install it as
# /config/dashboards/lran/vehicles.yaml.

title: Vehicles
views:
  - title: Vehicles
    path: vehicles
    icon: mdi:car-multiple
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: custom:fluvy-template-card
            name: "{{ states('counter.lran_gatelink_traversals_today') }} gate crossings since midnight"
            icon: mdi:car-multiple
            tap_action: { action: none }
            hold_action: { action: none }
            grid_options:
              columns: 12
          # HA's markdown card, because no Fluvy card takes a colour per row of text. The day
          # check hides yesterday's entries if HA was down at midnight.
          - type: markdown
            title: Log book
            content: |-
              {% set log = 'sensor.lran_gatelink_crossing_log' %}
              {% set entries = (state_attr(log, 'entries') or []) if state_attr(log, 'day') == (now().date() | string) else [] %}
              {% for e in entries %}
              {% if e.held %}<font color="red">{{ e.text }}</font>{% else %}{{ e.text }}{% endif %}

              {% else %}
              No gate crossings since midnight.
              {% endfor %}
            grid_options:
              columns: 12
