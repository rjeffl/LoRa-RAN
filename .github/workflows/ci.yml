# LRAN CI — System PRD §9.3.
#
# Three jobs, ordered by how fast they tell you something useful:
#
#   checks     seconds, no toolchain. Repository invariants and the host tools.
#   native     the Unity suites on the host: libraries and every firmware.
#   firmware   every firmware target, then the checks that read a built image.
#              One job per project, plus one for the bridge's V-B9 images.
#
# They are independent and run in parallel; a firmware target breaking does not
# hide a failing vector.
#
# `checks` runs on every change. `native` and `firmware` run only when a change can
# reach what they build, and the `changes` job decides that from the diff. Most pull
# requests here touch only docs/, and the firmware builds are eleven minutes of
# ESP32 compilation that such a change cannot affect. `main` still stays buildable (root
# CLAUDE.md): anything under lib/ or firmware/ runs both jobs, and so does any edit
# to this workflow. What the diff cannot see is a cached toolchain or a pinned
# package going bad under an unchanged tree, so a weekly scheduled run and a manual
# run build everything regardless.
#
# NO SECRETS ARE NEEDED OR AVAILABLE, AND THE BRIDGE DID NOT CHANGE THAT.
#
# The range test firmware is secrets-free by design — no WiFi, no MQTT, no key
# material (task guardrail 2). The bridge is not: it holds LRAN_MASTER_KEY, WiFi
# and broker credentials, and it is the target this header's older wording
# anticipated when it said such a target "needs a decision about CI, not a secret
# pasted into a workflow."
#
# The decision, taken 2026-09-10 and recorded in LRAN-Bridge-Firmware-Tasks §1.2:
# CI copies the COMMITTED TEMPLATE, `secrets.h.example`, whose LRAN_MASTER_KEY is
# 32 zero bytes. Nothing secret enters this workflow, and a build made this way
# cannot masquerade as a provisioned one — firmware/bridge/src/main.cpp checks the
# key at boot and says so on every line of its log.
#
# What is being tested here is that the bridge COMPILES. Anything that needs a real
# key is bench work against a real broker (B4), not a CI job.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Mondays 06:00 UTC. Builds everything; see the header.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

# The event name is in the group so that a push to main cannot cancel the weekly run
# on main, or the reverse.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which of the two slow jobs this change can reach. `checks` does not wait for it:
  # spec_citation_version.py reads docs/, so a docs-only change is where citation
  # drift arrives, and that job costs seconds.
  #
  # The patterns are the premise. A firmware build that reads a path listed nowhere
  # below is skipped by a change to that path, and nothing reports it; add the path
  # here in the same commit that makes a build depend on it.
  changes:
    name: Paths changed
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.paths.outputs.native }}
      firmware: ${{ steps.paths.outputs.firmware }}
      bridge: ${{ steps.paths.outputs.bridge }}
    steps:
      # Full history, because a push to main diffs against the previous tip, which
      # can be several commits back.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify the diff
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # A pull request checks out its merge commit, whose first parent is the
          # base it merges into, so HEAD^1..HEAD is exactly what the PR changes.
          case "$EVENT" in
            pull_request) base="HEAD^1" ;;
            push)         base="$PUSH_BEFORE" ;;
            *)            base="" ;;
          esac

          # Scheduled and manual runs build everything. So does a push whose previous
          # tip is not in the history: a new branch, or a force push past it.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No base to diff against, so every job runs."
            printf 'native=true\nfirmware=true\nbridge=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" HEAD)
          echo "Changed paths:"
          echo "$changed"

          # An edit to a workflow runs everything, so a CI change tests itself.
          all='^\.github/workflows/'
          # Vectors live under lib/lran-protocol/test/, and each firmware's build
          # scripts under its own directory, so lib/ and firmware/ cover both.
          native="$all|^(lib|firmware)/"
          # The firmware job also copies secrets.h.example and runs two checks that
          # read a built image or the installed RadioLib.
          firmware="$native|^secrets\.h\.example$|^tools/checks/bridge_partitions\.py$|^tools/rangetest/check_pa_table\.py$"
          # V-B9's bad images are bridge environments. They can rot only when the
          # bridge, a library it links or its secrets template changes.
          bridge="$all|^(lib|firmware/bridge)/|^secrets\.h\.example$"

          for job in native firmware bridge; do
            if grep -qE "${!job}" <<<"$changed"; then run=true; else run=false; fi
            echo "$job=$run" | tee -a "$GITHUB_OUTPUT"
          done

  checks:
    name: Repository checks and host tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # capture.py's tests import pyserial, and run_ci_local.py reads this file with
      # PyYAML. Nothing else here needs a dependency.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyserial pyyaml

      # run_ci_local.py runs this job's steps before a push, read from this file. A
      # change here that leaves it finding no steps fails now rather than letting it
      # report success on a machine where it ran nothing.
      - name: Local CI runner still parses this file
        run: python3 tools/checks/run_ci_local.py --list --job native

      # Fails when a "binding protocol" citation names a version the specification
      # has moved past. v0.9 changed nothing on the wire, so no test and no vector
      # caught that drift — only this does.
      - name: Versioned document citations
        run: python3 tools/checks/spec_citation_version.py

      # Spec §9.1 — key derivation must not depend on mbedtls_hkdf(). The header
      # ships with Arduino-ESP32 but the symbol is not built, so only a link
      # catches it on target; this catches it in seconds.
      - name: No mbedtls_hkdf dependency
        run: python3 tools/checks/no_mbedtls_hkdf.py

      # W4. The generator is written from the specification with the codec off
      # limits, and that independence is the whole value. A failure here is never
      # fixed by editing a vector — find out which side is wrong.
      - name: W4 protocol vectors
        run: python3 tools/vectors/check.py

      # Spec §13.2, W4. The JSON must be what generate.py produces, and the C++ suite's
      # vectors_data.h what embed.py produces from that JSON. Nothing checked the second
      # link until D57's two vectors went unembedded for three days, hiding a codec
      # defect (protocol-lib engineering log, 2026-09-23). Both render in memory and
      # write nothing, because run_ci_local.py runs this job on a developer's tree.
      - name: W4 vectors match their generators
        run: |
          python3 tools/vectors/generate.py --check
          python3 tools/vectors/embed.py --check

      # The tools are not scaffolding. The defect that destroyed a third of the
      # 2026-09-05 campaign was in capture.py, not in firmware, and nothing tested
      # the tool at all.
      - name: Range test host tools
        run: |
          python3 tools/rangetest/test_capture.py
          python3 tools/rangetest/test_survey_reintegrate.py
          python3 tools/rangetest/test_eirp_check.py

      # Impl Plan §7.2, §10.5: simctl's scenario table mirrors the firmware's fault
      # catalogue, and a fault added with no scenario is a row that never runs again.
      # Two lists that must agree fail silently and in the reassuring direction, like
      # the PA-table mirror. Its own tests make the check drift and assert it fails.
      - name: simctl catalogue
        run: |
          python3 tools/simctl/test_simctl.py
          python3 tools/checks/simctl_catalogue.py

      # Impl Plan §8.1: the M22 / V-B12 arithmetic. The guards are the point - a window
      # the bridge rebooted through, or one that carried another node's poll answer,
      # must refuse to produce a PER rather than produce a plausible wrong one.
      - name: M22 PER arithmetic
        run: python3 tools/simctl/test_per_measure.py

      # Impl Plan §6.6: BF-27's frame-log arithmetic. The guards are the point again,
      # and they are different guards - a `seq` jump that is a spec §10.3 resync rather
      # than 40 000 losses, a PING echo carrying the bridge's sequence into a node's
      # stream (W11), and the ring's own overwrites kept apart from a dropped MQTT
      # message. Each of those, folded in, produces a confident and wrong verdict about
      # the receive path.
      - name: BF-27 frame-log arithmetic
        run: python3 tools/simctl/test_rxlog_analyze.py

      # Impl Plan §8.1: the interleaved sweep's arithmetic. It pools one set of frames
      # two ways - by arm and by when they were sent - and the guard worth having is the
      # refusal: a run that moves both splits, or neither, has separated nothing, and
      # saying so is the result. A verdict that always names a winner would have called
      # every block-ordered sweep on record a spacing effect.
      - name: interleaved sweep arithmetic
        run: python3 tools/simctl/test_sweep_analyze.py

      # M25: the channel-capture arithmetic. Its guards are about a capture that ran for
      # hours unattended — a reboot mid-run puts two millis() clocks in one file, and a
      # bucket that sampled nothing is unobserved rather than quiet. Both produce a
      # confident wrong occupancy figure if folded in. The capture tool's own tests guard
      # --reset-on-open: DTR released before EN is pulsed, or the board boots the ROM
      # bootloader and the capture records a dead bridge; and never a reset on reconnect.
      - name: M25 channel-capture arithmetic and capture tool
        run: |
          python3 tools/simctl/test_rssi_analyze.py
          python3 tools/simctl/test_rssi_capture.py

      # Impl Plan §5.2 and Bridge PRD §1.3 property 2: lora_task never blocks on the
      # network. Prose has never stopped anyone writing that line, and the failure is
      # silent — telemetry lost during an outage that the bridge appeared to survive.
      # The check reads one function's text, so it is a tripwire on the shape of the
      # mistake rather than a proof. Its own fixtures run first.
      - name: lora_task never blocks
        run: |
          python3 tools/checks/lora_task_never_blocks.py --self-test
          python3 tools/checks/lora_task_never_blocks.py

      # D1 frequency change brief §5: several listen-only receivers a metre apart, each on
      # a candidate frequency 0.2 MHz from the next. The comparison assumes none of them
      # transmits, and a receiver that did would show in its neighbours' captures as an
      # excursion nothing could trace. The check reads source text; its fixtures run first.
      - name: chan-capture never transmits
        run: |
          python3 tools/checks/chan_capture_never_transmits.py --self-test
          python3 tools/checks/chan_capture_never_transmits.py

      # Impl Plan §6.5, R-5.3c: the bridge's A/B partition table cannot be changed on
      # a deployed board without a USB flash. Two equal OTA slots, otadata, no factory
      # partition, no overlap, inside 8 MB. The image-size and symbol checks need a
      # build, so they run in the `firmware` job.
      - name: Bridge partition table
        run: |
          python3 tools/checks/bridge_partitions.py --self-test
          python3 tools/checks/bridge_partitions.py

      # Impl Plan §4.4: the committed discovery examples against what the firmware would
      # actually publish. It compiles `discovery.cpp` with the host g++ — no PlatformIO
      # and no Xtensa toolchain, so it stays in this job — and diffs the result against
      # `ha/discovery/`. An example nobody checks drifts from the code the first time a
      # table row changes, silently, in the artifact somebody reaches for when Home
      # Assistant is not cooperating.
      - name: Home Assistant discovery examples
        run: python3 tools/checks/ha_examples.py

  native:
    name: Host Unity suites
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-native-${{ runner.os }}-${{ hashFiles('**/platformio.ini') }}
          restore-keys: pio-native-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio

      # Repo rule 7: /lib/lran-protocol/ must keep building in `native`. If this
      # breaks, that is a defect to fix now, not a nuisance to route around.
      - name: Protocol library
        run: pio test -d lib/lran-protocol -e native

      # Spec 12.3 media access, shared by the bridge and the simnode. Moved out of the
      # bridge on 2026-09-14 so the two firmwares run one implementation of it. M25's
      # channel sampler joined it on 2026-09-19, shared by the bridge and chan-capture.
      - name: Radio-link library
        run: pio test -d lib/lran-link -e native

      # BF-7's patch-after-encode primitive, checked byte for byte against the W4
      # negative vectors that the Python generator built the same way.
      - name: Fault-injection library
        run: pio test -d lib/lran-sim -e native

      # BF-32's library half. The parameter table every other copy is derived from
      # (D44), and the policy a CONFIG set runs through. Arduino-free, so the SET rules
      # of spec 7.4 and the split readback of 7.4.1 are tested without a board.
      - name: Configuration library
        run: pio test -d lib/lran-config -e native

      # VE.Direct HEX frames, checked against Victron's worked examples. The simnode's
      # simulated MPPT answers with it (BF-36) and the bridge reads registers with it
      # (BF-30), so a checksum rule the two disagreed on would never reach the air.
      - name: VE.Direct library
        run: pio test -d lib/vedirect -e native

      - name: Range test firmware
        run: pio test -d firmware/range-test -e native

      # The bridge's host suite needs no secrets: its `native` environment builds only
      # the Arduino-free translation units (the task table, the queue accounting, the
      # reconnect backoff and the topic grammar), and the repo root is deliberately off
      # that include path so a test cannot quietly depend on secrets.h.
      - name: Bridge firmware
        run: pio test -d firmware/bridge -e native

      # The simnode's identity table, protocol engine and console. No secrets: the tests use
      # the committed W4 test key, and the repo root is off the native include path.
      - name: Simnode firmware
        run: pio test -d firmware/simnode -e native

      # The listen-only receiver's frequency rules and console grammar. No secrets.
      - name: Channel-capture firmware
        run: pio test -d firmware/chan-capture -e native

  # One job per firmware project, in parallel. Run serially the builds took eleven
  # minutes; in parallel no job builds for more than about two and a half. Each job
  # repeats the runner setup, which is the price of the wall-clock time.
  # fail-fast is off so one project's failure does not cancel the others' results.
  firmware:
    name: Firmware - ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    # Job-level env cannot read the runner context, so not runner.temp. The directory
    # is in the checkout but never committed: CI does not push.
    env:
      PLATFORMIO_BUILD_CACHE_DIR: ${{ github.workspace }}/.pio-build-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          # Heltec WiFi LoRa 32 V3, then XIAO ESP32S3 + Wio-SX1262 Kit.
          - name: Range test
            id: range-test
            dir: firmware/range-test
            envs: heltec xiao
            secrets: false
          - name: Bridge Node
            id: bridge
            dir: firmware/bridge
            envs: heltec
            secrets: true
          # The simnode reads LRAN_MASTER_KEY from the same secrets.h as the bridge, so
          # it builds with the all-zero key and says so at boot. Both profiles.
          - name: Simnode
            id: simnode
            dir: firmware/simnode
            envs: simnode-heltec simnode-xiao-wio
            secrets: true
          # The listen-only receiver needs no secrets.h. Both boards, because brief §5
          # runs them side by side.
          - name: Channel capture
            id: chan-capture
            dir: firmware/chan-capture
            envs: heltec xiao-wio
            secrets: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The espressif32 toolchain is large and pinned, so caching it is the
      # difference between a two-minute job and a ten-minute one. Every project
      # shares the one key: ~/.platformio holds the platform and toolchain, and
      # each project's libraries live in its own .pio/.
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-firmware-${{ runner.os }}-${{ hashFiles('**/platformio.ini') }}
          restore-keys: pio-firmware-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio

      # SCons's derived-file cache, which PlatformIO enables through
      # PLATFORMIO_BUILD_CACHE_DIR. An object is reused only when its build signature
      # matches: the source's content, every header it includes, the command line and
      # the compiler binary. A stale object cannot be picked up, and the checkout's new
      # timestamps do not force a rebuild. Most of each build is Arduino-ESP32, which
      # changes only with the pinned platform.
      #
      # Every run saves a new entry and restores the newest, so the cache accumulates
      # objects until the weekly run, which skips the restore, builds from nothing and
      # saves a clean one.
      #
      # `-run-` ends the prefix. Without it, pio-build-bridge- also matched
      # pio-build-bridge-vb9-, and the bridge job restored the V-B9 job's objects.
      - name: Restore build cache
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.PLATFORMIO_BUILD_CACHE_DIR }}
          key: pio-build-${{ matrix.id }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pio-build-${{ matrix.id }}-run-

      # See this file's header for why copying the template is the decision rather
      # than a workaround. The copy is made in the runner's checkout and goes nowhere:
      # secrets.h is gitignored, and its committed template holds only placeholders.
      - name: secrets.h from the committed template
        if: matrix.secrets
        run: cp secrets.h.example secrets.h

      - name: Build ${{ matrix.envs }}
        id: build
        env:
          DIR: ${{ matrix.dir }}
          ENVS: ${{ matrix.envs }}
        run: |
          for env in $ENVS; do
            pio run -d "$DIR" -e "$env"
          done

      # After the build, whether or not it passed: the objects that compiled are
      # still valid, and SCons stores only those. Not when the build never ran, or an
      # empty directory would become the newest entry and the next run would restore it.
      - name: Save build cache
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.PLATFORMIO_BUILD_CACHE_DIR }}
          key: pio-build-${{ matrix.id }}-run-${{ github.run_id }}-${{ github.run_attempt }}

      # BF-13. Two things only a build can show. The image must leave room in its OTA
      # slot (past 90 % is one release from USB-only updates). And rollback depends on
      # ota.cpp's extern "C" verifyRollbackLater() overriding Arduino's weak default -
      # a C++ definition links cleanly and overrides nothing, so the symbol table is
      # the one place that is visible without flashing a board.
      - name: Bridge OTA slot headroom and rollback override
        if: matrix.dir == 'firmware/bridge'
        run: >
          python3 tools/checks/bridge_partitions.py
          --firmware firmware/bridge/.pio/build/heltec/firmware.bin
          --elf firmware/bridge/.pio/build/heltec/firmware.elf

      # Root rule 9. pa_config.cpp mirrors a file-static table inside RadioLib so
      # the applied PA configuration can be logged, because the SX1262 cannot read
      # it back. A RadioLib bump that changes that table is silent everywhere else.
      # This runs here, not in `checks`, because it reads the installed library, and
      # in the range test's job because that is the project it reads it from.
      - name: PA table mirror vs. pinned RadioLib
        if: matrix.dir == 'firmware/range-test'
        run: python3 tools/rangetest/check_pa_table.py

  # V-B9's two deliberately bad images. Built so the test harness cannot rot between
  # the runs that need it; never flashed by CI. A job of their own, because they are
  # the longest build here (about 2.5 minutes) and need only a bridge-side change.
  bridge-vb9:
    name: Firmware - Bridge V-B9 bad images
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    # Job-level env cannot read the runner context, so not runner.temp. The directory
    # is in the checkout but never committed: CI does not push.
    env:
      PLATFORMIO_BUILD_CACHE_DIR: ${{ github.workspace }}/.pio-build-cache
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-firmware-${{ runner.os }}-${{ hashFiles('**/platformio.ini') }}
          restore-keys: pio-firmware-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio

      # The firmware job's build cache, under a key of its own; see that job.
      - name: Restore build cache
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.PLATFORMIO_BUILD_CACHE_DIR }}
          key: pio-build-bridge-vb9-run-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pio-build-bridge-vb9-run-

      # The bridge's environments read secrets.h; see the firmware job.
      - name: secrets.h from the committed template
        run: cp secrets.h.example secrets.h

      - name: V-B9 no-network and panic images, and V-B12's blaster image
        id: build
        run: |
          pio run -d firmware/bridge -e v_b9_no_network
          pio run -d firmware/bridge -e v_b9_panic
          pio run -d firmware/bridge -e v_b12_blaster

      - name: Save build cache
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.PLATFORMIO_BUILD_CACHE_DIR }}
          key: pio-build-bridge-vb9-run-${{ github.run_id }}-${{ github.run_attempt }}
