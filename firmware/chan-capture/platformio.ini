; firmware/chan-capture/ - lran-chan-capture, a listen-only RSSI sampler. M25; D1 frequency
; change brief section 5.
;
; Binding specification: docs/shared/LRAN-Protocol-Specification.md v0.12 (ver = 2)
;
; NEEDS NO secrets.h. It holds no key, joins no network and sends no frame, so it builds in
; a fresh clone and in CI with nothing copied in.
;
; ONE IMAGE PER BOARD, THE FREQUENCY AT RUNTIME. `freq <hz>` on the serial console stores a
; frequency in NVS and reboots; every boot prints it in CHAN-BOOT. capture_config.h says why
; a build flag per frequency was the wrong shape.

[platformio]
default_envs = heltec

[capture_target]
platform = espressif32@6.13.0
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder

; D32 and root rule 9 - pinned exactly, matching every other firmware.
lib_deps =
    jgromes/RadioLib@7.7.1
lib_extra_dirs = ../../lib

build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -DCORE_DEBUG_LEVEL=2
build_unflags = -std=gnu++11
extra_scripts = pre:scripts/version.py
test_ignore = *

; DO NOT HARDCODE upload_port. Both Heltecs' CP2102 bridges report SER=0001 and port names
; move on replug; tell the boards apart by enclosure, and pass --upload-port.

[env:heltec]
extends = capture_target
board = heltec_wifi_lora_32_V3
build_flags =
    ${capture_target.build_flags}
    -DLRAN_PROFILE_HELTEC

; The XIAO runs Serial over native USB CDC, and RadioLib 7.7.1 emits an unconditional
; #warning under ARDUINO_USB_CDC_ON_BOOT that no pragma reaches. -Wno-error=cpp downgrades
; that one diagnostic in this one environment and keeps it printed (root CLAUDE.md, Style -
; the simnode's and the range test's XIAO environments, same reason).
[env:xiao-wio]
extends = capture_target
board = seeed_xiao_esp32s3
build_flags =
    ${capture_target.build_flags}
    -Wno-error=cpp
    -DLRAN_PROFILE_XIAO_WIO_KIT

; Host - the frequency rules and the console grammar. The sampler's own tests live with it,
; in lib/lran-link.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -I src
lib_extra_dirs = ../../lib
build_src_filter = +<capture_config.cpp>
test_build_src = yes
