; firmware/bridge/ - LRAN Bridge Node, node 0x00. Milestone B2 (BF-10 to BF-14); B3 from BF-16.
;
; Requirements: docs/bridge/LRAN-Bridge_Node-PRD.md
; Build:        docs/bridge/LRAN-Bridge_Node-Implementation-Plan.md
; Tasks:        docs/bridge/LRAN-Bridge-Firmware-Tasks.md
; Binding specification: docs/shared/LRAN-Protocol-Specification.md v0.16 (ver = 2)
;
; THIS PROJECT NEEDS secrets.h. It is the only firmware here that does - it is the
; only one holding LRAN_MASTER_KEY, WiFi and broker credentials (Impl Plan 11.4).
; The file is gitignored; secrets.h.example at the repo root is its template and the
; documentation for what a fresh clone needs:
;
;     cp secrets.h.example secrets.h        # then fill it in
;
; A build without it fails in src/main.cpp with a message naming this step, rather
; than with a file-not-found on a header nobody has heard of.

[platformio]
default_envs = heltec

; ---------------------------------------------------------------------------
; Target - Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262). The bridge board.
;
; The flat-case unit is the bridge board (docs/bridge/HANDOFF.md). It first ran this
; firmware in B2's bench session, 2026-09-13.
; ---------------------------------------------------------------------------
[env:heltec]
platform = espressif32@6.13.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder

; D32 and repo rule 9 - RadioLib is THE SX1262 driver for every firmware here, and
; its version is PINNED EXACTLY, matching firmware/range-test/. Four firmwares share
; this driver; letting it float in one of four is how a fleet-wide regression arrives
; with no commit to blame.
;
; BF-16's `lora_link.cpp` is its one consumer here. The pin predates it by design: rule
; 9 is about the platformio.ini and not about the call site, and a driver added later
; tends to be added at whatever version is current that day. lora_link.cpp reads the
; SX126x IRQ register directly, so a RadioLib bump is a reason to re-read that file.
;
; The display driver is pinned to the range test's own version (Impl Plan 5.1.1 -
; ThingPulse, not U8g2). Same board, same panel, same driver: a difference between the
; two firmwares' displays should never be a library version.
lib_deps =
    jgromes/RadioLib@7.7.1
    bertmelis/espMqttClient@1.7.3
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.6.2

; Reaches the shared codec the way every firmware in this repo does (Impl Plan 5.4).
lib_extra_dirs = ../../lib

; -I ../.. puts the repo root on the include path, which is how `secrets.h` is found
; (Impl Plan 11.4: one gitignored file at the root, referenced by each project).
;
; BF-37 - espMqttClient replaced PubSubClient, D5's designated fallback, because spec
; 16.3 requires QoS 1 for events and PubSubClient 2.8 publishes at QoS 0 only. Pinned
; exactly, like every library here. The EMC_ flags below configure it:
;
;   EMC_USE_MEMPOOL=1       Each outgoing packet comes from a static pool, not the heap
;                           (root rule 3). The pool is 48 blocks of 512 bytes, about 24 KB,
;                           and packets span blocks. mqtt_esp.h has the argument.
;   EMC_NUM_POOL_ELEMENTS   48. Also caps the packets outstanding at once. mqtt_task hands
;                           over work only while fewer than kMaxPendingPublishes (8) are
;                           unfinished, so the pool holds one tick's work, a reconnect's
;                           CONNECT and the events awaiting PUBACK, with room left.
;   EMC_ALLOW_NOT_CONNECTED_PUBLISH=0
;                           A publish while not connected is refused, not queued. The
;                           bridge's own queues ride out an outage; the pool does not.
;
; PubSubClient needed MQTT_MAX_PACKET_SIZE raised for discovery (D5). espMqttClient sizes
; each packet to its contents, so the flag is gone; kMaxPayloadLen is the cap now.
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -I ../..
    -DCORE_DEBUG_LEVEL=3
    -DEMC_USE_MEMPOOL=1
    -DEMC_NUM_POOL_ELEMENTS=48
    -DEMC_SIZE_POOL_ELEMENTS=512
    -DEMC_ALLOW_NOT_CONNECTED_PUBLISH=0
    -I ../../lib/lran-protocol/platform/esp32
build_unflags = -std=gnu++11

; BF-15 - the platform HMAC and HKDF. They live under the library's platform/ rather than
; its src/, so that include/lran/ never depends on mbedTLS (root rule 7), and each firmware
; builds the one its target needs. registry_runtime.cpp is the only caller.
build_src_filter = +<*> +<../../../lib/lran-protocol/platform/esp32/>

; BF-13 - the A/B OTA table (Impl Plan 6.5, R-5.3c). COMMITTED, not the board's
; default: a platform bump that changed the board definition's table would change
; this one silently, and it is the one thing on this node OTA cannot fix afterwards.
; partitions.csv says why each row is sized as it is; bridge_partitions.py checks it.
board_build.partitions = partitions.csv

; R-5.3e - the release a person chose. scripts/version.py stamps it, and the git
; commit that was actually built, into LRAN_BRIDGE_VERSION / LRAN_BRIDGE_GIT. After a
; rollback the git field is what proves which image is running.
custom_bridge_version = 0.1.0
extra_scripts = pre:scripts/version.py

; DO NOT HARDCODE upload_port / monitor_port. Two machines build this repo and either
; board may be on either; PlatformIO autodetects. Override on the command line when it
; picks wrong, and on macOS always /dev/cu.*, never /dev/tty.*.
;
; USB IS THE RECOVERY PATH (R-5.3a). `pio run -t upload -e heltec` writes the
; bootloader, this partition table, boot_app0.bin - which resets otadata to boot app0 -
; and the image. Whatever OTA did before, a USB flash puts the board back in a known
; state.

; The host tests are native-only.
test_ignore = test_smoke, test_tasks, test_net, test_ota, test_ui

; ---------------------------------------------------------------------------
; OTA over WiFi - the same image, uploaded by espota instead of esptool (R-5.3a).
;
;   LRAN_OTA_PASSWORD=... pio run -d firmware/bridge -e heltec_ota -t upload
;
; The password comes from the environment and must match OTA_PASSWORD in secrets.h.
; It is never written into this file: platformio.ini is committed, and a password
; here is a password in public history (root CLAUDE.md, Secrets).
;
; mDNS name first; if the LAN does not resolve .local, pass the bridge's IP with
; --upload-port. An upload is DEFERRED while lora_task reports a transaction
; outstanding (R-5.3d) - espota retries its invitation for a few seconds, which
; outlasts one.
; ---------------------------------------------------------------------------
[env:heltec_ota]
extends = env:heltec
upload_protocol = espota
upload_port = lran-bridge.local
upload_flags =
    --auth=${sysenv.LRAN_OTA_PASSWORD}

; ---------------------------------------------------------------------------
; V-B9 - "OTA succeeds, and a deliberately bad image rolls back." Two bad images,
; because there are two ways to be bad and the bridge recovers from each by a
; different path. Impl Plan 6.5.1 is the procedure; neither is ever a production build.
;
;   v_b9_no_network  boots, starts its tasks, never associates. Tests THIS firmware's
;                    verdict: nothing marks it valid, the deadline passes, ota.cpp
;                    rolls it back. The case Arduino's default gets wrong.
;   v_b9_panic       aborts in setup(). Tests the BOOTLOADER: it resets in
;                    PENDING_VERIFY and is rolled back before any code of ours runs.
;
; The verdict's two numbers are shortened here and ONLY here, so a V-B9 run takes
; minutes rather than ten. The test proves the mechanism, not the production numbers,
; and ota_policy.h says so where they are defined.
; ---------------------------------------------------------------------------
[env:v_b9_no_network]
extends = env:heltec_ota
build_flags =
    ${env:heltec.build_flags}
    -DLRAN_V_B9_BAD_IMAGE=1
    -DLRAN_OTA_MIN_UPTIME_MS=20000u
    -DLRAN_OTA_VERIFY_DEADLINE_MS=90000u

[env:v_b9_panic]
extends = env:heltec_ota
build_flags =
    ${env:heltec.build_flags}
    -DLRAN_V_B9_BAD_IMAGE=2

; ---------------------------------------------------------------------------
; V-B12 - LoRa PER with WiFi idle versus saturated (M22, Bridge PRD R-4.4). The
; production image cannot load its own WiFi transmitter: diag_interval_s has a 10 s
; floor. This image adds a UDP blaster driven from the USB serial port (src/blaster.h)
; and is otherwise the production build. It is flashed over USB, because the sweep
; holds that port open anyway. Never a production build.
; ---------------------------------------------------------------------------
[env:v_b12_blaster]
extends = env:heltec
build_flags =
    ${env:heltec.build_flags}
    -DLRAN_V_B12_BLASTER=1

; ---------------------------------------------------------------------------
; Host - the Unity suite. Root CLAUDE.md and Impl Plan 5.4: every firmware project
; defines a `native` environment that builds and runs the shared-library tests.
;
; What this environment is FOR is stated in the plan: "a library that only compiles
; for ESP32-S3 has quietly acquired a platform dependency, and the place that
; surfaces is the host build". So it links /lib/lran-protocol/ from THIS project and
; exercises it, rather than trusting that the library's own native environment
; passing means it will link here too.
;
; No secrets.h, no -I ../.. - nothing host-side needs key material, and keeping the
; root off this include path is what stops a test quietly depending on it.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -I src
    -I ../../lib/lran-protocol/platform/native
    -I ../../lib/lran-protocol/test/test_vectors
lib_extra_dirs = ../../lib

; Only the Arduino-free translation units, and that list IS the seam. tasks.cpp and
; queues.cpp carry the task table, the queue depths and the drop accounting -
; everything BF-11 decided - while task_runtime.cpp holds the FreeRTOS calls and
; main.cpp the sketch. A file that migrates from the second group to the first has to
; be added here, which is a visible edit in a review.
build_src_filter = +<tasks.cpp> +<queues.cpp> +<net_policy.cpp> +<mqtt_transport.cpp> +<ota_policy.cpp> +<status_page.cpp> +<rx_ladder.cpp> +<frame_log.cpp> +<registry.cpp> +<scheduler.cpp> +<node_availability.cpp> +<diag_json.cpp> +<error_reply.cpp> +<command.cpp> +<discovery.cpp> +<config_json.cpp> +<config_store.cpp> +<config_path.cpp> +<phy_change.cpp> +<levers.cpp> +<context_roll.cpp> +<publish.cpp> +<dummy.cpp> +<hex_proxy.cpp> +<charge_readback.cpp> +<log.cpp> +<../../../lib/lran-protocol/platform/native/>
test_build_src = yes
