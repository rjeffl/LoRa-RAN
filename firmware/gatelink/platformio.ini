; firmware/gatelink/ - GateLink, node 0x01. Task L6 (the skeleton); GL0-GL9 build on it.
;
; Requirements: docs/gatelink/LRAN-GateLink_Node-PRD.md
; Build:        docs/gatelink/LRAN-GateLink_Node-Implementation-Plan.md section 5
; Binding specification: docs/shared/LRAN-Protocol-Specification.md v0.17 (ver = 2)
;
; THIS PROJECT NEEDS secrets.h, and reads LRAN_GATELINK_NODE_KEY from it and nothing else
; (Impl Plan 6.8). The node holds its own derived key, never the master. CI builds against
; the committed template, whose key is 32 zero bytes, and the banner says so at boot.
;
; THE ENVIRONMENT STARTED FROM wattcycle-reader's m5stack_stamplc, which has run on this
; board, and Impl Plan 5.1 lists the four changes that brought it to the fleet's rules.

[platformio]
default_envs = gatelink

; ---------------------------------------------------------------------------
; Target - M5Stack StamPLC (K141), with the carrier (gatelink-expansion-board rev 0.3).
;
; The StamPLC's SoC is an ESP32-S3FN8: 8 MB flash, no PSRAM. esp32-s3-devkitc-1 is
; PlatformIO's closest board definition, and M5Stack's Arduino documentation names it too.
; ---------------------------------------------------------------------------
[env:gatelink]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder

; Every version pinned exactly. RadioLib by D32 and root rule 9; the rest because a library
; floating in one firmware brings a regression with no commit to blame (the bridge's
; platformio.ini). The M5Stack and NimBLE versions are the ones wattcycle-reader resolved
; and ran on this board. Note that M5Unified 0.2.20 is older than the M5GFX 0.2.27 beside
; it; that is the pair which ran. Read the INSTALLED M5StamPLC headers under .pio/libdeps/,
; because the published package has drifted from its GitHub main.
lib_deps =
    jgromes/RadioLib@7.7.1
    h2zero/NimBLE-Arduino@1.4.3
    m5stack/M5StamPLC@1.2.0
    m5stack/M5Unified@0.2.20
    m5stack/M5GFX@0.2.27
lib_extra_dirs = ../../lib

; -I ../.. finds the root secrets.h. The esp32 platform directory is lran-protocol's mbedTLS
; HMAC and HKDF, which live outside the library's own build (lib/lran-protocol/platform/).
;
; ARDUINO_USB_CDC_ON_BOOT=1: the StamPLC has no USB-UART bridge, so its native USB is the
; serial port. Without the flag, Serial binds to UART0, whose pins go nowhere, and every
; print is lost while the boot ROM lines still appear.
;
; -Wno-error=cpp: under that flag RadioLib 7.7.1 emits an unconditional #warning that no
; pragma reaches. This downgrades that one diagnostic in this one environment and keeps it
; printed; every other warning still fails the build (root CLAUDE.md, Style; the simnode's
; simnode-xiao-wio env, same reason).
; Nothing includes RadioLib until GL0 adds radio.cpp, so the L6 build prints no #warning.
; The flag is set now so that GL0's first build does not fail on it.
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -Wno-error=cpp
    -I ../..
    -I ../../lib/lran-protocol/platform/esp32
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11
build_src_filter = +<*> -<bringup.cpp> +<../../../lib/lran-protocol/platform/esp32/>

; One factory app partition, no otadata; the file says why.
board_build.partitions = partitions.csv

; The release a person chose. scripts/version.py stamps it, and the git commit actually
; built, into LRAN_GATELINK_VERSION and LRAN_GATELINK_GIT for the boot banner.
custom_gatelink_version = 0.1.0
extra_scripts = pre:scripts/version.py

; DO NOT HARDCODE upload_port. The StamPLC and the XIAO both enumerate as
; /dev/cu.usbmodem*; tell them apart by the boot banner and pass --upload-port.

; The host tests are native-only.
test_ignore = test_tasks, test_ui_pages, test_gate_io, test_gatelink_app

; ---------------------------------------------------------------------------
; The carrier bring-up image, GL0 (expansion board 11, steps 1-4). bringup.cpp replaces
; main.cpp and the task runtime: a serial console that walks the radio up one step at a
; time. It needs no secrets.h, because it holds no key and speaks no protocol.
; ---------------------------------------------------------------------------
[env:gatelink-bringup]
extends = env:gatelink
build_src_filter = -<*> +<bringup.cpp> +<board_stamplc.cpp> +<spi_bus.cpp> +<ui_pages.cpp>

; ---------------------------------------------------------------------------
; Host - the Arduino-free translation units. The list IS the seam: a file that moves
; across it is a visible edit in review. No secrets.h and no -I ../.. on this path; the
; tests use their own keys.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -I src
    -I ../../lib/lran-protocol/platform/native
    -I ../../lib/lran-protocol/test/test_vectors
lib_extra_dirs = ../../lib
build_src_filter = +<tasks.cpp> +<ui_pages.cpp> +<gate_io.cpp> +<gatelink_app.cpp> +<config_store.cpp> +<ved_link.cpp> +<bms_link.cpp> +<../../../lib/lran-protocol/platform/native/>
test_build_src = yes
