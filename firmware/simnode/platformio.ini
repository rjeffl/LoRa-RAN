; firmware/simnode/ - lran-simnode, bench nodes 0xF0-0xF3. Milestone B0 (BF-2 to BF-9).
;
; Build:        docs/bridge/LRAN-Bridge_Node-Implementation-Plan.md section 10
; Tasks:        docs/bridge/LRAN-Bridge-Firmware-Tasks.md section 4
; Binding specification: docs/shared/LRAN-Protocol-Specification.md v0.13 (ver = 2)
;
; THIS PROJECT NEEDS secrets.h, and reads LRAN_MASTER_KEY from it and nothing else. The
; simnode holds the master key for bench convenience (Impl Plan 10.3); a real node never
; does. Decided with the operator on 2026-09-14: the same gitignored root file the bridge
; reads, so both derive the same node keys, and CI builds against the committed template
; exactly as it does for the bridge. main.cpp says so at boot when the key is the template's.
;
; Profiles are build environments; roles are runtime (Impl Plan 10.8). A profile supplies
; one RadioPins instance and nothing else.

[platformio]
default_envs = simnode-heltec

[simnode_target]
platform = espressif32@6.13.0
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder

; D32 and root rule 9 - pinned exactly, matching the bridge and the range test. The display
; driver is the bridge's pin too (BF-9): same panel, same driver, so a difference between the
; two firmwares' displays is never a library version. The XIAO profile drives the Seeeduino
; XIAO expansion board's SSD1306 with it, as the range test's xiao env does.
lib_deps =
    jgromes/RadioLib@7.7.1
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.6.2
lib_extra_dirs = ../../lib

; -I ../.. finds the root secrets.h. The esp32 platform directory is the library's mbedTLS
; HMAC and HKDF, which live outside its build (lib/lran-protocol/platform/).
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -I ../..
    -I ../../lib/lran-protocol/platform/esp32
    -DCORE_DEBUG_LEVEL=2
build_unflags = -std=gnu++11
build_src_filter = +<*> +<../../../lib/lran-protocol/platform/esp32/>
test_ignore = test_identity, test_node, test_console, test_fault, test_oled, test_gatelink

; DO NOT HARDCODE upload_port. Both Heltecs' CP2102 bridges report SER=0001 and port
; names move on replug; tell the boards apart by enclosure, and pass --upload-port.

[env:simnode-heltec]
extends = simnode_target
board = heltec_wifi_lora_32_V3
build_flags =
    ${simnode_target.build_flags}
    -DLRAN_PROFILE_HELTEC

; The XIAO runs Serial over native USB CDC, and RadioLib 7.7.1 emits an unconditional
; #warning under ARDUINO_USB_CDC_ON_BOOT that no pragma reaches. -Wno-error=cpp downgrades
; that one diagnostic in this one environment and keeps it printed; every other warning
; still fails the build (root CLAUDE.md, Style - the range test's xiao env, same reason).
[env:simnode-xiao-wio]
extends = simnode_target
board = seeed_xiao_esp32s3
build_flags =
    ${simnode_target.build_flags}
    -Wno-error=cpp
    -DLRAN_PROFILE_XIAO_WIO_KIT

; Host - the Arduino-free translation units, which is where every protocol decision this
; firmware makes lives. The list IS the seam: a file that needs to move across it is a
; visible edit here. No secrets.h and no -I ../.. on this path; the tests use the committed
; W4 test key.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -I src
    -I ../../lib/lran-protocol/platform/native
    -I ../../lib/lran-protocol/test/test_vectors
lib_extra_dirs = ../../lib
build_src_filter = +<identity.cpp> +<node.cpp> +<console.cpp> +<fault.cpp> +<gatelink.cpp> +<oled_page.cpp> +<../../../lib/lran-protocol/platform/native/>
test_build_src = yes
