; firmware/range-test/ - LRAN range test firmware, pass 1.
;
; Tasks: docs/rangetest/LRAN-Range-Test-Firmware-Pass1-Tasks.md
; Binding specification: docs/shared/LRAN-Protocol-Specification.md v0.13 (ver = 2)
;
; THIS FIRMWARE NEVER SHIPS. It is not the seed of bridge firmware and it is not a
; node. See CLAUDE.md in this directory before adding anything to it.
;
; No WiFi, no MQTT, no secrets.h, no Home Assistant (task guardrail 2). PING carries
; no MAC (spec 9.2), so nothing here needs key material.

[platformio]
default_envs = heltec

; ---------------------------------------------------------------------------
; Target - Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262). Both boards, pass 1.
; ---------------------------------------------------------------------------
[env:heltec]
platform = espressif32@6.13.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder

; D32 and repo rule 9 - RadioLib is THE SX1262 driver for every firmware here, and
; its version is PINNED EXACTLY, not floated with a caret. Four firmwares share this
; driver; letting it float in one of four is how a fleet-wide regression arrives with
; no commit to blame.
;
; The OLED driver is pinned the same way for the same reason, though no decision
; compels it - a bench instrument whose display library moves under it produces
; unexplained differences between one walk and the next.
lib_deps =
    jgromes/RadioLib@7.7.1
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.6.2

; Reaches the shared codec the way every firmware in this repo does. Needed by R9
; only (real PING frames over RF); R1-R8 do not touch it.
lib_extra_dirs = ../../lib

; ---------------------------------------------------------------------------
; THE ANTENNA. Change this line when you change the antenna, and reflash.
;
; D33 standing condition 1: the 15.249 ceiling is on EIRP, which is conducted power
; PLUS antenna gain, so this figure is an INPUT TO THE POWER CLAMP and not just a
; column in the CSV. Get it wrong and two things are wrong together - the trace
; records an antenna that was not fitted, AND the clamp permits an EIRP over the
; ceiling by exactly the error.
;
;   2.0 dBi (stock whip)  -> conducted ceiling -3 dBm
;   3.0 dBi (production)  -> conducted ceiling -4 dBm
;
; It lives here rather than buried in main.cpp so that an antenna swap is a one-line
; decision visible in the build and in the diff. M21 - the modules' own FCC grant
; conditions - is what turns this from a nameplate figure into an audited one, and it
; is open.
; ---------------------------------------------------------------------------
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -DCORE_DEBUG_LEVEL=3
    -DLRAN_ANTENNA_GAIN_DBI10=30
build_unflags = -std=gnu++11

; Task R1: DO NOT HARDCODE upload_port / monitor_port. The Kubuntu field machine and
; the macOS build machine enumerate the CP2102 differently, and either board may end
; up on either machine. PlatformIO autodetects; override on the command line when it
; picks wrong:
;
;   pio run -e heltec -t upload --upload-port /dev/cu.usbserial-0001
;
; On macOS always /dev/cu.*, never /dev/tty.*.

; The host tests are native-only.
test_ignore = test_phy_params, test_pa_config, test_airtime, test_bench_frame, test_sweep, test_csv, test_resp_log, test_survey, test_w9

; ---------------------------------------------------------------------------
; Target - XIAO ESP32S3 + Wio-SX1262 KIT (Seeed p-5982, B2B). Pass 2, task X6.
;
; THE KIT, NOT THE HEADER BOARD. Seeed sells two Wio-SX1262 products whose maps share
; only the three SPI nets; `LRAN_BOARD_XIAO_WIO_KIT` selects the B2B one. See
; src/board_config.h and docs/rangetest/LRAN-Range-Test-Firmware-Pass2-Tasks.md 2.1.
;
; This board does NOT validate GateLink's carrier - it validates the module, the
; driver and the config seam. Pass 2 Tasks 2.2 before quoting a result from it.
; ---------------------------------------------------------------------------
[env:xiao]
platform = espressif32@6.13.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder

; D32 and repo rule 9 - PINNED EXACTLY, and pinned to the SAME versions as [env:heltec].
; A driver that floats in one of N environments is how a fleet-wide regression arrives
; with no commit to blame; a driver pinned to two DIFFERENT versions across two
; environments is worse, because the two boards then disagree for a reason that looks
; like the radio.
lib_deps =
    jgromes/RadioLib@7.7.1
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.6.2

lib_extra_dirs = ../../lib

; ---------------------------------------------------------------------------
; THE ANTENNA - read [env:heltec]'s block above; every word of it applies here.
;
; 3.0 dBi assumed for range-test work, giving a -4 dBm conducted ceiling. Numerically
; the same figure as the Heltec environment, but SET EXPLICITLY rather than inherited:
; a shared default is how two environments silently diverge the day one antenna is
; changed and the other is not.
;
; Over-stating gain is the CONSERVATIVE error, because the clamp lowers the conducted
; ceiling as gain rises. So 3.0 dBi safely covers the bench stubby and anything else at
; or below 3.0 dBi. A HIGHER-gain antenna is a flag change and a reflash, not a note.
; ---------------------------------------------------------------------------
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -Wno-error=cpp
    -DCORE_DEBUG_LEVEL=3
    -DLRAN_ANTENNA_GAIN_DBI10=30
    -DLRAN_BOARD_XIAO_WIO_KIT
build_unflags = -std=gnu++11

; ---------------------------------------------------------------------------
; -Wno-error=cpp - THE ONE PLACE THIS PROJECT RELAXES -Werror, and only here.
;
; RadioLib.h fires an unconditional `#warning` whenever ARDUINO_USB_CDC_ON_BOOT == 1:
; "Use of USB CDC for debug output is not recommended (might stop on first sleep)."
; The board definition sets that macro, so the XIAO cannot build without this. The
; Heltec is unaffected - its CP2102 is a separate chip and the macro is 0 there.
;
; IT IS A FALSE POSITIVE HERE, on both halves of its claim:
;   - it warns about RADIOLIB'S OWN debug output, and RADIOLIB_DEBUG is not enabled in
;     either environment, so RadioLib prints nothing over any port;
;   - the hazard it names is "might stop on first sleep", and this is a mains-powered
;     bench instrument that never sleeps.
;
; WHAT THIS DOES AND DOES NOT COST. It downgrades #warning directives from errors to
; warnings. It does NOT silence them - RadioLib's "unknown platform" and "low-end
; platform" warnings would still PRINT in the build log, which is where they would be
; noticed. So the signal is kept and only the enforcement is dropped, for one class of
; diagnostic, in one environment.
;
; A `#pragma GCC diagnostic ignored "-Wcpp"` around the include in radio_link.cpp was
; tried first and DOES NOT WORK: GCC issues #warning from libcpp and the diagnostic
; pragma does not apply to it (it does in Clang, which is what makes the idea look
; right). Recorded so the next person does not spend the same twenty minutes.
;
; Every other warning in this environment is still an error.
; ---------------------------------------------------------------------------

; ---------------------------------------------------------------------------
; NATIVE USB, NOT A UART BRIDGE - and it is not only a port-name difference.
;
; The board definition already supplies ARDUINO_USB_MODE=1 and ARDUINO_USB_CDC_ON_BOOT=1,
; so Serial works with no flags added here. The consequence is elsewhere:
;
; The Heltec's CP2102 is a SEPARATE CHIP. It stays enumerated when the ESP32 resets, so
; the host's open port survives and both the R1 role-selection window and capture.py see
; the boot output. On the XIAO the USB device IS the ESP32 - a reset TEARS THE DEVICE
; DOWN and the host must re-enumerate it, which takes a second or more.
;
; MEASURED 2026-09-05, AND THE FEAR WAS MISPLACED - the note above described a real
; mechanism but the wrong consequence. Reset-to-first-byte:
;
;   XIAO   104-106 ms      Heltec (CP2102)  106-109 ms      n=4 each
;
; The port handle SURVIVED every trial. A run-mode reset does not tear down the host
; connection, because the ROM bootloader and the running application both use the same
; USB-Serial-JTAG peripheral (303A:1001), so the USB device never disappears. The 3 s
; role window and capture.py's boot window have the same margin here as on the Heltec.
; No window was lengthened; nothing needed it.
;
; WHERE IT DOES BITE IS FLASHING, which the original note did not predict. Coming FROM a
; firmware with a different USB stack - the stock Meshtastic build enumerates as TinyUSB
; CDC 2886:0059 - the reset into download mode swaps the USB device, esptool loses its
; port handle mid-connect, and the upload fails with "Could not configure port". The
; board IS in the bootloader; it is simply on a NEW port. Flash to that port and it
; succeeds. Once this firmware is installed the problem does not recur, because it and
; the ROM share the peripheral. See Pass 2 Tasks 3.5.
;
; Same rule as [env:heltec]: DO NOT HARDCODE upload_port / monitor_port.
; On macOS the XIAO enumerates as /dev/cu.usbmodem*, not /dev/cu.usbserial*.
; ---------------------------------------------------------------------------

test_ignore = test_phy_params, test_pa_config, test_airtime, test_bench_frame, test_sweep, test_csv, test_resp_log, test_survey, test_w9

; ---------------------------------------------------------------------------
; Host - the Unity suite. Root CLAUDE.md: every project defines a native
; environment. The D33 power clamp lives here because it is pure arithmetic and
; because getting it wrong puts illegal power on the air; a bench is the wrong place
; to discover that.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -I src
    -DLRAN_ANTENNA_GAIN_DBI10=30

; R9 links the shared codec, so the HOST environment has to reach it too. Repo rule
; 7: /lib/lran-protocol/ builds in `native` with no Arduino or ESP-IDF header, which
; is exactly what makes the fragmented PING round trip testable at a desk instead of
; at the far end of a walk.
lib_extra_dirs = ../../lib

; Only the Arduino-free translation units. board_config.h and phy_params.* are kept
; free of Arduino and RadioLib headers precisely so this list can exist.
build_src_filter = +<phy_params.cpp> +<pa_config.cpp> +<airtime.cpp> +<bench_frame.cpp> +<sweep.cpp> +<csv.cpp> +<resp_log.cpp> +<survey.cpp> +<w9.cpp>
test_build_src = yes
