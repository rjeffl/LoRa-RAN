; firmware/range-test/ - LRAN range test firmware, pass 1.
;
; Tasks: docs/rangetest/LRAN-Range-Test-Firmware-Pass1-Tasks.md
; Binding specification: docs/shared/LRAN-Protocol-Specification.md v0.7 (ver = 2)
;
; THIS FIRMWARE NEVER SHIPS. It is not the seed of bridge firmware and it is not a
; node. See CLAUDE.md in this directory before adding anything to it.
;
; No WiFi, no MQTT, no secrets.h, no Home Assistant (task guardrail 2). PING carries
; no MAC (spec 9.2), so nothing here needs key material.

[platformio]
default_envs = heltec

; ---------------------------------------------------------------------------
; Target - Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262). Both boards, pass 1.
; ---------------------------------------------------------------------------
[env:heltec]
platform = espressif32@6.13.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder

; D32 and repo rule 9 - RadioLib is THE SX1262 driver for every firmware here, and
; its version is PINNED EXACTLY, not floated with a caret. Four firmwares share this
; driver; letting it float in one of four is how a fleet-wide regression arrives with
; no commit to blame.
;
; The OLED driver is pinned the same way for the same reason, though no decision
; compels it - a bench instrument whose display library moves under it produces
; unexplained differences between one walk and the next.
lib_deps =
    jgromes/RadioLib@7.7.1
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.6.2

; Reaches the shared codec the way every firmware in this repo does. Needed by R9
; only (real PING frames over RF); R1-R8 do not touch it.
lib_extra_dirs = ../../lib

build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -DCORE_DEBUG_LEVEL=3
build_unflags = -std=gnu++11

; Task R1: DO NOT HARDCODE upload_port / monitor_port. The Kubuntu field machine and
; the macOS build machine enumerate the CP2102 differently, and either board may end
; up on either machine. PlatformIO autodetects; override on the command line when it
; picks wrong:
;
;   pio run -e heltec -t upload --upload-port /dev/cu.usbserial-0001
;
; On macOS always /dev/cu.*, never /dev/tty.*.

; The host tests are native-only.
test_ignore = test_phy_params, test_airtime, test_bench_frame, test_sweep, test_csv, test_resp_log, test_survey

; ---------------------------------------------------------------------------
; Host - the Unity suite. Root CLAUDE.md: every project defines a native
; environment. The D33 power clamp lives here because it is pure arithmetic and
; because getting it wrong puts illegal power on the air; a bench is the wrong place
; to discover that.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -I src

; Only the Arduino-free translation units. board_config.h and phy_params.* are kept
; free of Arduino and RadioLib headers precisely so this list can exist.
build_src_filter = +<phy_params.cpp> +<airtime.cpp> +<bench_frame.cpp> +<sweep.cpp> +<csv.cpp> +<resp_log.cpp> +<survey.cpp>
test_build_src = yes
