; WattCycle BLE BMS Reader — PoC
; See docs/wattcycle-reader-poc_3.md §6 (stack), §13.1 (build host notes).
;
; The BMS library moved to the repository's lib/bms-ble/ (GateLink task L2), and both
; targets build against it through lib_extra_dirs. Its 21 host tests moved with it:
;
;   pio test -d ../lib/bms-ble -e native
;
; NimBLE and the M5Stack set are pinned exactly, to the versions that ran here and that
; firmware/gatelink pins. The move changed lib_deps, so PlatformIO resolved them again,
; and M5StamPLC's ^1.2.0 then fetched a release whose Display is a method: TftDisplay.cpp
; stopped compiling.

[platformio]
default_envs = heltec_wifi_lora_32_V3

; ---------------------------------------------------------------------------
; Target board — Heltec WiFi LoRa 32 V3 (ESP32-S3)
; ---------------------------------------------------------------------------
[env:heltec_wifi_lora_32_V3]
platform = espressif32@^6.9.0   ; pinned per §13.1 — do not float
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.4.0
lib_extra_dirs = ../lib
build_flags =
    -DCORE_DEBUG_LEVEL=3

; TftDisplay.cpp (StamPLC-only, needs M5StamPLC.h) isn't built for this env —
; only BmsDisplay.cpp (the SSD1306 OLED implementation) is.
build_src_filter = +<*> -<TftDisplay.cpp>

; §13.1(5): always /dev/cu.*, never /dev/tty.*. PlatformIO usually autodetects;
; uncomment and set explicitly if it picks the wrong one.
; upload_port = /dev/cu.usbserial-0001
; monitor_port = /dev/cu.usbserial-0001

; ---------------------------------------------------------------------------
; Target board — M5Stack StamPLC, the actual node hardware chosen for
; GateLink (decided after this PoC's board was already in hand). Same
; ESP32-S3 family as the Heltec V3, so the BLE/protocol code is unchanged —
; only the board id differs.
;
; StamPLC's SoC is an ESP32-S3FN8 (8 MB flash, no PSRAM); `esp32-s3-devkitc-1`
; is PlatformIO's closest match ("8 MB QD, No PSRAM") and is also what
; M5Stack's own Arduino docs point to, since there's no StamPLC-specific
; board JSON in this platform version.
;
; StamPLC's display (M7a) is a completely different animal from the Heltec's
; OLED — a 1.14" SPI ST7789v2 TFT (MOSI G8, SCK G7, CS G12, RS G6, RST G3;
; backlight behind a PI4IOE5V6408 IO expander on P7) rather than an I2C
; SSD1306. TftDisplay (src/TftDisplay.h/.cpp) drives it via the official
; m5stack/M5StamPLC library (which pulls in M5Unified + M5GFX), rather than
; hand-rolling the ST7789 init and the IO-expander-gated backlight — M5Stack
; publishes a working example for exactly this board, and getting an I2C IO
; expander's register protocol wrong by hand isn't worth the risk when a
; tested implementation already exists. BOARD_STAMPLC picks TftDisplay over
; BmsDisplay in src/main.cpp.
; ---------------------------------------------------------------------------
[env:m5stack_stamplc]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
    m5stack/M5StamPLC@1.2.0
    m5stack/M5Unified@0.2.20
    m5stack/M5GFX@0.2.27
lib_extra_dirs = ../lib
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_STAMPLC
    ; StamPLC has no external USB-UART bridge — the ESP32-S3's native USB IS
    ; the serial port (enumerates as /dev/cu.usbmodemXXXX, not usbserial).
    ; The board default sets ARDUINO_USB_MODE=1 but not USB_CDC_ON_BOOT, so
    ; without this flag Serial silently binds to UART0 (unconnected pins on
    ; this board) instead of the native USB CDC everyone is actually
    ; listening on. Confirmed on hardware: without it, the boot ROM lines and
    ; NimBLE's internal ESP_LOG output still arrive (separate console path),
    ; but every Serial.print()/printf() in this codebase is silently lost.
    -DARDUINO_USB_CDC_ON_BOOT=1

; BmsDisplay.cpp (Heltec-only, needs SSD1306Wire) isn't built for this env —
; only TftDisplay.cpp (the StamPLC TFT implementation) is.
build_src_filter = +<*> -<BmsDisplay.cpp>

; StamPLC's native USB enumerates as /dev/cu.usbmodemXXXX — a different
; naming pattern from the Heltec V3's UART-bridge /dev/cu.usbserial-XXXX, so
; the two rarely collide even with both boards attached. Uncomment and set
; explicitly if autodetection ever picks the wrong one anyway.
; upload_port = /dev/cu.usbmodem1101
; monitor_port = /dev/cu.usbmodem1101
