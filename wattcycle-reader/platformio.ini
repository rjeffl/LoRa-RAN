; WattCycle BLE BMS Reader — PoC
; See docs/wattcycle-reader-poc_3.md §6 (stack), §13.1 (build host notes).

[platformio]
default_envs = heltec_wifi_lora_32_V3

; ---------------------------------------------------------------------------
; Target board — Heltec WiFi LoRa 32 V3 (ESP32-S3)
; ---------------------------------------------------------------------------
[env:heltec_wifi_lora_32_V3]
platform = espressif32@^6.9.0   ; pinned per §13.1 — do not float
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.4.0
build_flags =
    -DCORE_DEBUG_LEVEL=3

; The host-side protocol tests are native-only; don't try to run them on target.
test_ignore = test_tdt_protocol

; §13.1(5): always /dev/cu.*, never /dev/tty.*. PlatformIO usually autodetects;
; uncomment and set explicitly if it picks the wrong one.
; upload_port = /dev/cu.usbserial-0001
; monitor_port = /dev/cu.usbserial-0001

; ---------------------------------------------------------------------------
; Host build — runs test/test_tdt_protocol against the §5.7 captured frames.
; No hardware, no Arduino, no NimBLE. `pio test -e native`
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -Wall
    -Wextra
